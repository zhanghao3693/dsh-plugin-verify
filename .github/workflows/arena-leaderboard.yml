name: Arena leaderboard sync

# 抓 LMArena（Arena）官方文本榜并回写 dpharness.com 首页的「大模型排行榜 · 国外榜」。
#
# 为什么必须放在 Actions：arena.ai（原 lmarena.ai，2026-01-28 更名，旧域名会 301 过来）
# 与 huggingface.co 在中国大陆均不可达，
# 而站点服务器在腾讯云境内（2026-09-16 实测 code=000）。
# 国内榜走站点自己的定时任务（SuperCLUE 的 xlsx 境内可直连），两边互不重叠。

on:
  schedule:
    # 北京时间 06:23（UTC 22:23）—— 早于站点 07:00 的国内榜同步，便于运维一次性查看。
    #
    # 刻意避开整点：GitHub Actions 的 cron 在 UTC 整点是提交高峰，schedule 会被排队。
    # 实测原 `0 22 * * *`（UTC 22:00）的实际触发时间是 UTC 01:11 / 02:01 / 05:53 / 08:31
    # 等，最晚比计划点晚约 10 小时（2026-09-16 ~ 10-02 共 26 次运行），
    # 于是「早上 06:00 看当日国外榜」这个预期经常落空。错开整点可显著降低延迟。
    - cron: "23 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不推送（排查用）"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 20 → 40 分钟：HF 冷索引时脚本要退避重试（单请求最坏 450s×6 次尝试），
    # 而总榜有 409 行、要分 5 页拉。20 分钟会把「已经重试成功、但分页没拉完」
    # 的 run 从超时上杀掉，判成失败（2026-09-30 实测踩到）。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and push leaderboard
        env:
          DPH_API_URL: https://dpharness.com
          DPH_API_TOKEN: ${{ secrets.DPH_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/fetch_arena_leaderboard.py --dry-run
          else
            python scripts/fetch_arena_leaderboard.py
          fi
