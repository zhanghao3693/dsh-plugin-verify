name: dsh plugin risk scan

# 静态风险扫描（与 verify.yml 的实装验证并列的第二个维度）。
#
# verify.yml  = 「装得上吗」—— 真的 dsh plugin add 一遍
# 本 workflow = 「装上了它会做什么」—— 只读源码做静态分析，不执行任何插件代码
#
# 两者共用一个 secret（DPH_API_TOKEN，站点侧 RISK_TOKEN 未单独配置时回落 VERIFY_TOKEN）。
#
# ── 为什么用 cron 而不是「跑完自触发下一轮」────────────────────────────────
# verify.yml 已实证：GitHub 禁止 workflow 监听自身（workflow_run 链会断），
# 自链方案不可行。故这里沿用同一策略：cron 定时 + 手动 workflow_dispatch。
#
# 触发时间刻意与 verify 错开 30 分钟（verify 是整点 0 分）：
# 两个 job 并发跑会争抢 runner 与 npm/codeload 出口带宽，
# 错峰既减少互相拖慢，也避免同一时刻的两份长任务同时打满配额。
# ── 触发方式：仅手动（schedule 已于 2026-09-24 停用）─────────────────────────
# 🔴 为什么停掉 schedule：这条线**已迁到 dpharness 生产服务器**（宿主 cron →
#    dsh-verifier 容器 → docker 内网直连站点 API），见站点仓
#    `scripts/server-cron/run-risk-round.sh`。
#    两个原因：① hosted runner 的 schedule **只有约一半的计划轮次真正触发**
#    （实测 2026-09-23/24：计划每 2 小时一轮，实际每天 5~6 轮）⇒ 吞吐不可控；
#    ② 服务器侧可走 docker 内网直连，少一跳公网失败面。
#
# ⚠ 必须停掉 schedule 而不是"两边都跑"：两条线会用**同一个** `/api/risk/queue`，
#   而队列排序是「未扫描优先」⇒ 两边每次都取到**同一批头部插件**，
#   等于把 GitHub 额度与服务器算力各浪费一份，吞吐却完全不涨。
#
# 本 workflow 保留 workflow_dispatch 供应急（服务器故障时手动补一轮）。
# ⚠ 若真要用它，注意本仓的 risk-scan.mjs 与站点仓的副本是**两份**，
#   改动必须同步（用 sha256 校验，见站点仓 run-risk-round.sh 头部说明）。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮扫描插件数"
        required: false
        default: "600"

jobs:
  risk-scan:
    runs-on: ubuntu-latest
    # 单轮预算：600 个 × 中位 3.8s ÷ 并发 4 ≈ 10 分钟。
    # 留足余量（大包解包 + 重试 + 网络抖动），但不要设太大 ——
    # 万一卡死，超时就是唯一的兜底。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      # 自检必须在扫描之前：这几条不变式（动态命令可达、剪贴板读写分离、
      # 证据截断不影响判定、证据快照可读）一旦失效，扫描**不会报错**，
      # 只会静默给出更宽松的结论 —— 正是最危险的一类失效。
      # 所以宁可整轮不跑，也不回传一份不可信的结论。
      - name: Self-test invariants
        run: node scripts/selftest.mjs

      - name: Run risk scan
        env:
          RISK_CI: "1"
          DPH_API_URL: https://dpharness.com
          DPH_API_TOKEN: ${{ secrets.DPH_API_TOKEN }}
          # 2026-09-23 新增：扫描器读 process.env.GH_TOKEN（risk-scan.mjs:806）。
          # 此前 workflow 未配该变量 ⇒ 拉 GitHub 源码全部匿名 ⇒ CI 侧 401。
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RISK_LIMIT: ${{ github.event.inputs.limit || '600' }}
          RISK_CONCURRENCY: "4"
          RISK_BATCH: "20"
          # runner 磁盘不大，且一次全量要过 8000+ 个包的解包产物；
          # 低于阈值就提前收尾并回传已完成部分，剩余顺延下一轮。
          RISK_DISK_MIN_MB: "2048"
        run: node risk-scan.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-scan-results
          path: risk-results.jsonl
          retention-days: 30
