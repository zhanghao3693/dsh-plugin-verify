name: dsh plugin risk scan

# 静态风险扫描（与 verify.yml 的实装验证并列的第二个维度）。
#
# verify.yml  = 「装得上吗」—— 真的 dsh plugin add 一遍
# 本 workflow = 「装上了它会做什么」—— 只读源码做静态分析，不执行任何插件代码
#
# 两者共用一个 secret（DPH_API_TOKEN，站点侧 RISK_TOKEN 未单独配置时回落 VERIFY_TOKEN）。
#
# ── 为什么用 cron 而不是「跑完自触发下一轮」────────────────────────────────
# verify.yml 已实证：GitHub 禁止 workflow 监听自身（workflow_run 链会断），
# 自链方案不可行。故这里沿用同一策略：cron 定时 + 手动 workflow_dispatch。
#
# 触发时间刻意与 verify 错开 30 分钟（verify 是整点 0 分）：
# 两个 job 并发跑会争抢 runner 与 npm/codeload 出口带宽，
# 错峰既减少互相拖慢，也避免同一时刻的两份长任务同时打满配额。
# ── 触发策略：每 30 分钟一次 + 并发组串行化 ─────────────────────────────────
# 🔴 为什么**不**放到生产服务器跑（2026-09-24 实测否决，别再试一次）：
#    服务器（腾讯云广州，2 vCPU）到 GitHub 的链路速率剧烈波动，实测
#    100KB/s ~ 600KB/s（差 6 倍），且与仓库体积无关。同一批 40 个条目：
#      本 workflow（GitHub runner）：**49 秒**完成，失败率 **5%**
#      服务器：**约 25 分钟**，失败率 **35%**（curl_err_28 超时挂死）
#    ⇒ runner 快约 30 倍、失败率低 7 倍。服务器唯一优势是 cron 触发可靠，
#      但那个用「提高调度频率」就能补，不必换场地。
#    （已排除「容器 CPU 限额」这个变量：100KB/s 是在**宿主机上直接 curl** 量的。）
#
# 频率为什么提到每 15 分钟（2026-09-24 实测标定）：
#   hosted runner 的 schedule 在本仓有**两个叠加的不可靠性**：
#     ① **延迟极大**：对照同仓 arena-leaderboard（cron `0 22 * * *`），
#        每一次实际触发都落在 23:41~00:21 UTC ⇒ **固定延迟约 2 小时**；
#        risk-scan 历史亦见 +15min / +2h29min / −8min 的散乱分布。
#     ② **约一半的计划轮次被直接丢弃**：09-23 11:59 ~ 09-24 07:45 共约 20 小时，
#        计划 10 轮、实际只跑 5 轮。
#   ⇒ 单靠调频率无法根治，但**频率是唯一不需要额外权限的补偿手段**：
#     每 15 分钟 = 96 次/天，即使只有 25% 命中也有约 24 轮/天，
#     按 400 个/轮 ≈ 9600 个/天，足以吃掉 1.1 万个积压。
#   （若要**确定性触发**，需给触发方一个带 workflow/actions:write 权限的令牌，
#     由可靠 cron 调 workflow_dispatch —— 属权限升级，待定，见技能文档 10.2。）
#
# 🔴 并发组是**必需**的，不是优化：队列接口 `/api/risk/queue` 排序是
#    「未扫描优先」（riskAutoAt 升序、null 排最前）⇒ 两次并发会取到
#    **同一批头部插件**，回传时互相覆盖，等于白跑一倍、吞吐完全不涨。
#    cancel-in-progress=false：让后来者排队而不是打断进行中的那轮
#    （打断会浪费已下载的成果）。
#
# 与 verify.yml 的错峰不再严格必要（两者不在同一台机器上争带宽），
# 但仍刻意错开 15 分钟，避免同一时刻两份长任务抢 GitHub 侧出口。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮扫描插件数"
        required: false
        default: "400"

concurrency:
  group: risk-scan
  cancel-in-progress: false

jobs:
  risk-scan:
    runs-on: ubuntu-latest
    # 单轮预算：400 个 × 实测 1.22s（含下载+扫描+回传，并发 4）≈ 8 分钟。
    # 留足余量（大包解包 + 重试 + 网络抖动），但不要设太大 ——
    # 万一卡死，超时就是唯一的兜底。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      # 自检必须在扫描之前：这几条不变式（动态命令可达、剪贴板读写分离、
      # 证据截断不影响判定、证据快照可读）一旦失效，扫描**不会报错**，
      # 只会静默给出更宽松的结论 —— 正是最危险的一类失效。
      # 所以宁可整轮不跑，也不回传一份不可信的结论。
      - name: Self-test invariants
        run: node scripts/selftest.mjs

      - name: Run risk scan
        env:
          RISK_CI: "1"
          DPH_API_URL: https://dpharness.com
          DPH_API_TOKEN: ${{ secrets.DPH_API_TOKEN }}
          # 扫描器读 process.env.GH_TOKEN 作为**取源凭证**。
          # ⚠ 必须是能读其他仓库的 PAT：Actions 内置 `github.token` 作用域
          #   仅本仓库，拿它请求别人的 tarball 等同匿名 ⇒ 401（一天 435/600 个）。
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RISK_LIMIT: ${{ github.event.inputs.limit || '400' }}
          RISK_CONCURRENCY: "4"
          RISK_BATCH: "20"
          # runner 磁盘不大，且一次全量要过 8000+ 个包的解包产物；
          # 低于阈值就提前收尾并回传已完成部分，剩余顺延下一轮。
          RISK_DISK_MIN_MB: "2048"
        run: node risk-scan.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-scan-results
          path: risk-results.jsonl
          retention-days: 30
