name: dsh plugin verify

on:
  schedule:
    # 每 2 小时一轮 —— 这是「不引入 PAT 前提下」唯一能提高日吞吐的手段。
    #
    # 为什么不搞「跑完自链」：GitHub 禁止 workflow 监听自身
    #   (`workflow 'dsh plugin verify' cannot listen to itself`)，文件会直接失效；
    # 而拆成两个 workflow 互推也不行 —— 用 GITHUB_TOKEN 触发 dispatches
    # 不会连锁触发新 workflow，必须用 PAT。
    #
    # 为什么不加大单轮 limit：100 个约 75 分钟，加到 200 → 150 分钟，
    # 越长越容易被 GitHub 回收 runner（曾见 exit code 143）。加频率、不加单轮长度。
    #
    # 12 轮/天 × 100 = 约 1200 个/天（原 2 轮/天只有 200）。
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮验证插件数"
        required: false
        default: "100"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Run verification
        env:
          DPH_API_URL: https://dpharness.com
          DPH_API_TOKEN: ${{ secrets.DPH_API_TOKEN }}
          VERIFY_LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: node verify.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: verify-results.json
          retention-days: 30
